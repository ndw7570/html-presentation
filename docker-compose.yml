services:
  deck:
    build: .
    image: html-deck-board
    container_name: html-deck-board
    restart: unless-stopped
    ports:
      # 왼쪽이 서버에서 열리는 포트. 오른쪽은 컨테이너 안쪽이라 바꾸지 않는다.
      - "${HOST_PORT:-4300}:4300"
    environment:
      MAX_UPLOAD: "${MAX_UPLOAD:-50mb}"
      # 첫 계정. 계정이 하나도 없을 때만 쓰이고, 만든 뒤에는 무시된다.
      # 값은 여기 적지 말고 같은 폴더의 .env 에 둔다.
      ADMIN_USER: "${ADMIN_USER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # HTTPS 뒤에 둘 때 1 로 켠다. 세션 쿠키가 평문 연결로 안 나간다.
      SECURE_COOKIE: "${SECURE_COOKIE:-0}"
    volumes:
      # 올린 발표가 쌓이는 자리. 이 폴더만 백업하면 전부 보존된다.
      - ./data:/data
